# Nginx site config for https://mano-agency.henderlandcorps.in
#
# Use this only if henderlandcorps.in is hosted on a VPS/server you control.
# For cPanel/shared hosting use web/.htaccess instead.
#
# 1. Copy build/web/* to /var/www/mano-agency/
# 2. Save this file as /etc/nginx/sites-available/mano-agency.henderlandcorps.in
# 3. sudo ln -s /etc/nginx/sites-available/mano-agency.henderlandcorps.in \
#      /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d mano-agency.henderlandcorps.in

server {
    listen 80;
    listen [::]:80;
    server_name mano-agency.henderlandcorps.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mano-agency.henderlandcorps.in;

    root /var/www/mano-agency;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/mano-agency.henderlandcorps.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mano-agency.henderlandcorps.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # Never cache the app shell or service worker.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Flutter needs the correct MIME type for WebAssembly.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:js|png|jpe?g|svg|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
