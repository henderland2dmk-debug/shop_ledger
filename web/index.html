<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mano Agency shop inventory and billing app. Manage stock, create bills, import Excel sheets and print invoices.">
  <meta name="theme-color" content="#1F6B45">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mano Agency">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mano Agency — Shop Inventory &amp; Billing">
  <meta property="og:description" content="Manage stock, create bills, import Excel sheets and print invoices.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mano Agency — Shop Inventory &amp; Billing</title>
  <link rel="manifest" href="manifest.json">

  <noscript>
    <style>#loading { display: none !important; }</style>
  </noscript>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F5F7F3;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: #F5F7F3;
      color: #13452C;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      z-index: 9999;
    }

    #loading img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      border-radius: 18px;
      background: #FFFFFF;
      box-shadow: 0 8px 24px rgba(19, 69, 44, 0.12);
    }

    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #CDDFC3;
      border-top-color: #1F6B45;
      border-radius: 50%;
      animation: mano-spin 0.9s linear infinite;
    }

    #loading p {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    #loading small {
      color: #5E6F63;
      font-size: 12px;
      font-weight: 400;
    }

    @keyframes mano-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 2.5s; }
    }

    noscript {
      display: block;
      padding: 32px 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #13452C;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="Mano Agency logo">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading Mano Agency…</p>
    <small>Preparing your shop ledger</small>
  </div>

  <noscript>
    <h1>JavaScript is required</h1>
    <p>Please enable JavaScript in your browser to use the Mano Agency web app.</p>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
